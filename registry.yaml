# registry.yaml — cadastro central de cidades/estados cobertos pelo Permit Radar.
#
# status (o que o robozinho faz com a cidade):
#   confirmed     -> testada ao vivo; entra no dashboard e no e-mail
#   experimental  -> adaptador pronto, mas ainda sem confirmação dos dados; roda e aparece no log
#   needs_adapter -> fonte pública sem login, falta construir/ligar o adaptador da plataforma
#   to_investigate-> existe consulta online, plataforma ainda não identificada
#   address_only  -> só dá para consultar por endereço (não serve para listar permits novos)
#   login_required-> exige cadastro/login (não automatizamos)
#   planning_only -> só processos de planejamento/zoneamento
#
# access: open_data_api | file_report | search_by_address_or_record | address_only | login_required | planning_only
# field_map: só precisa listar o que for diferente do padrão (aceita listas de alternativas).

states:

  massachusetts:
    cities:

      # ======================= CONFIRMADAS (testadas ao vivo) =======================

      - name: Boston
        source_type: ckan
        status: confirmed
        access: open_data_api
        config:
          base_url: "https://data.boston.gov/api/3/action/datastore_search_sql"
          resource_id: "6ddcd912-32a0-43df-9908-63574f8c7e77"
          date_field: "issued_date"
        field_map:
          permit_number: permitnumber
          address: address
          permit_type: permittypedescr
          status: status
          estimated_value: declared_valuation
          issue_date: issued_date
          description: comments
          applicant: applicant
          # Boston não publica o campo "contractor"; o "applicant" costuma ser quem executa a obra.
          contractor: [contractor, applicant]
        source_link: "https://www.boston.gov/boston-permitting"

      - name: Cambridge
        source_type: socrata
        status: confirmed
        access: open_data_api
        config:
          domain: "data.cambridgema.gov"
          datasets:
            "New Construction": "9qm7-wbdc"
            "Addition/Alteration": "qu2z-8suj"
        field_map: {}
        source_link: "https://www.cambridgema.gov/departments/opendata"

      - name: Worcester
        source_type: arcgis_query
        status: confirmed
        access: open_data_api
        config:
          service_url: "https://services1.arcgis.com/j8dqo2DJE7mVUBU1/arcgis/rest/services/Building_Permits/FeatureServer/0"
          order_by: "ObjectId ASC"     # o registro mais novo vem primeiro
          page_size: 1000
          max_pages: 2
          # Desde ~mai/2026 a cidade deixou de informar o tipo em ~95% dos permits novos ("N/A").
          unknown_type_label: "Building Permit (type not listed)"
        field_map:
          description: occupancy_type  # ex.: "1 or 2 Family Dwelling"
        source_link: "https://www.worcesterma.gov/inspections/permit-history"
        notes: "Sem valor da obra. Desde ~mai/2026 tipo e contratante quase sempre vêm como N/A (limite da fonte). Servidor limita consultas (o código espera e repete)."

      # ======================= EM TESTE (adaptador pronto) =======================

      - name: Reading
        source_type: file_report
        status: experimental
        access: file_report
        config:
          index_url: "https://www.readingma.gov/959/Monthly-Building-Permit-Report"
          link_regex: 'DocumentCenter/View/\d+'
          link_text_regex: "Building Permits Issued"
          max_files: 2
          min_days_back: 45
        field_map: {}
        source_link: "https://www.readingma.gov/959/Monthly-Building-Permit-Report"
        portal_url: "https://readingma.portal.opengov.com/"
        notes: "Relatório mensal em Excel (confirmado). Colunas ainda não vistas: o primeiro log mostra os nomes reais."

      # ======================= PDF: PRECISAM DE ADAPTADOR DE PLATAFORMA =======================

      - name: Newton
        source_type: opengov_portal
        status: needs_adapter
        access: search_by_address_or_record
        portal_url: "https://newtonma.viewpointcloud.com/search"
        info_url: "https://www.newtonma.gov/government/inspectional-services"
        notes: "OpenGov/ViewpointCloud (NewGov). Consulta sem login por endereço ou número do registro; os detalhes trazem escopo e contratante."

      - name: Brookline
        source_type: accela
        status: needs_adapter
        access: search_by_address_or_record
        portal_url: "https://aca-prod.accela.com/BROOKLINE/Welcome.aspx?TabName=Home"
        info_url: "https://brooklinema.teamdynamix.com/TDClient/101/Portal/KB/Article/17096/ACCELA-Searching-for-Records"
        notes: "Accela Citizen Access. Pesquisa por número, endereço ou nome."

      - name: North Reading
        source_type: permiteyes
        status: needs_adapter
        access: search_by_address_or_record
        info_url: "https://www.northreadingma.gov/210/Project-Updates"
        notes: "PermitEyes Public View (permits ativos desde set/2019)."

      - name: Concord
