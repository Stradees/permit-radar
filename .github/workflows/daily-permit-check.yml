name: Daily Permit Check

on:
  schedule:
    - cron: "0 11 * * *"   # todo dia, ~7h da manhã em Boston
  workflow_dispatch: {}     # permite ligar manualmente com um botão

permissions:
  contents: write           # permite o robozinho salvar os resultados

jobs:
  check-permits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r backend-v2/requirements.txt

      - name: Rodar coleta + digest + e-mail
        working-directory: backend-v2
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
        run: python digest_and_email.py

      - name: Salvar histórico e resultados
        run: |
          git config user.name "permit-radar-bot"
          git config user.email "bot@permitradar.local"
          git add backend-v2/permit_history.db backend-v2/latest_permits.json
          git diff --quiet --cached || git commit -m "Atualização diária de permits"
          git push
