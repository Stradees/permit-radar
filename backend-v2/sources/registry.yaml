# registry.yaml — cadastro central de cidades/estados cobertos pelo Permit Radar.
#
# status:
#   confirmed           -> pronto pra rodar em produção
#   needs_field_mapping -> fonte existe, falta confirmar campos
#   no_public_api       -> plataforma sem API pública (Accela / OpenGov / MUNIS)
#
# field_map: só precisa listar o que for diferente do padrão. Um campo pode ter uma
# lista de alternativas, ex.: contractor: [contractor, applicant] (usa o primeiro que existir).

states:

  massachusetts:
    cities:

      - name: Boston
        source_type: ckan
        status: confirmed
        config:
          base_url: "https://data.boston.gov/api/3/action/datastore_search_sql"
          resource_id: "6ddcd912-32a0-43df-9908-63574f8c7e77"
          date_field: "issued_date"
        field_map:
          permit_number: permitnumber
          address: address
          permit_type: permittypedescr
          status: status
          estimated_value: declared_valuation
          issue_date: issued_date
          description: comments
          applicant: applicant
          # Boston não publica o campo "contractor"; o "applicant" costuma ser quem executa a obra.
          contractor: [contractor, applicant]
        source_link: "https://www.boston.gov/departments/inspectional-services"

      - name: Cambridge
        source_type: socrata
        status: confirmed
        config:
          domain: "data.cambridgema.gov"
          datasets:
            "New Construction": "9qm7-wbdc"
            "Addition/Alteration": "qu2z-8suj"
        field_map: {}
        source_link: "https://www.cambridgema.gov/departments/opendata"

      - name: Worcester
        source_type: arcgis
        status: needs_field_mapping
        config:
          geojson_url: "https://opendata.arcgis.com/datasets/c2309c7a5f0a491d88aac4a80602e5aa_0.geojson"
        field_map: {}
        source_link: "https://opendata.worcesterma.gov/datasets/building-permits/explore"

      - name: West Springfield
        source_type: arcgis
        status: needs_field_mapping
        config:
          geojson_url: ""
        field_map: {}
        source_link: "https://opendata-westspringfield.hub.arcgis.com/"

      # ---- Cidades sem API pública (precisam de outra abordagem) ----

      - name: Springfield
        source_type: opengov_portal
        status: no_public_api
        portal_url: "https://springfieldma.portal.opengov.com/"

      - name: New Bedford
        source_type: opengov_portal
        status: no_public_api
        portal_url: "https://newbedfordma.portal.opengov.com/"

      - name: Haverhill
        source_type: opengov_portal
        status: no_public_api
        portal_url: "https://haverhillma.portal.opengov.com/"

      - name: Brookline
        source_type: accela
        status: no_public_api
        portal_url: "https://aca-prod.accela.com/"

      - name: Lowell
        source_type: munis_css
        status: no_public_api
        portal_url: "https://www.lowellma.gov/1631/Online-Permitting"

      - name: Quincy
        source_type: opengov_portal
        status: no_public_api
        portal_url: "https://quincyma.portal.opengov.com/"

      - name: Gloucester
        source_type: opengov_portal
        status: no_public_api
        portal_url: "https://gloucesterma.portal.opengov.com/"

      - name: Lexington
        source_type: opengov_portal
        status: no_public_api
        portal_url: "https://lexingtonma.portal.opengov.com/"

  # Próximo estado: mesma estrutura, ativar quando formos expandir.
